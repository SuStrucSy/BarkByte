name: Deploy to Server

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH keep-alive
        run: |
          mkdir -p ~/.ssh
          echo "ServerAliveInterval 60" >> ~/.ssh/config
          echo "ServerAliveCountMax 10" >> ~/.ssh/config

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DOMAIN: ${{ secrets.DOMAIN }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
          STACK_NAME: ${{ secrets.STACK_NAME }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
        run: |
          ssh $SSH_USER@$SSH_HOST 'bash -s' <<'EOF'
            set -e
            cd ~/timverse-app
            git pull origin main

            # 1️⃣ Write .env safely
            cat > .env <<ENVFILE
            DOMAIN='${DOMAIN}'
            FRONTEND_HOST='${FRONTEND_HOST}'
            ENVIRONMENT='production'
            STACK_NAME='${STACK_NAME}'
            PROJECT_NAME='${PROJECT_NAME}'
            SECRET_KEY='${SECRET_KEY}'
            FIRST_SUPERUSER='${FIRST_SUPERUSER}'
            FIRST_SUPERUSER_PASSWORD='${FIRST_SUPERUSER_PASSWORD}'
            BACKEND_CORS_ORIGINS='${BACKEND_CORS_ORIGINS}'
            VITE_API_URL='${VITE_API_URL}'
            POSTGRES_SERVER='db'
            POSTGRES_PORT='5432'
            POSTGRES_DB='${POSTGRES_DB}'
            POSTGRES_USER='${POSTGRES_USER}'
            POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'
            SMTP_HOST='${SMTP_HOST}'
            SMTP_USER='${SMTP_USER}'
            SMTP_PASSWORD='${SMTP_PASSWORD}'
            EMAILS_FROM_EMAIL='${EMAILS_FROM_EMAIL}'
            DOCKER_IMAGE_BACKEND='timverse-backend'
            DOCKER_IMAGE_FRONTEND='timverse-frontend'
            TAG='latest'
            ENVFILE

            # 2️⃣ Ensure DB password matches .env
            DB_CONTAINER=$(docker ps --filter "name=db" --format "{{.Names}}" | head -n1)
            if [ -n "$DB_CONTAINER" ]; then
              echo "Updating Postgres password for ${POSTGRES_USER}"
              docker exec -i "$DB_CONTAINER" psql -U postgres -c \
                "ALTER USER ${POSTGRES_USER} WITH PASSWORD '${POSTGRES_PASSWORD}';"
            fi

            # 3️⃣ Build images
            docker compose -f docker-compose.yml build

            # 4️⃣ Bring up containers in order
            docker compose -f docker-compose.yml up -d db
            docker compose -f docker-compose.yml up -d prestart
            docker compose -f docker-compose.yml up -d backend frontend
            EOF
