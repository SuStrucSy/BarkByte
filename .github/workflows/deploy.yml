name: Deploy to Server

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.2.0)"
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            NODE_ENV=production

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      # ... your SSH setup steps stay the same ...

      - name: Deploy
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DOMAIN: ${{ secrets.DOMAIN }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
          STACK_NAME: ${{ secrets.STACK_NAME }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh $SSH_USER@$SSH_HOST "TAG=$TAG REPO=$REPO bash -s" <<EOF
            set -e
            cd ~/timverse-app

            echo "Deploying \$TAG"

            git fetch --tags
            git checkout \$TAG

            CURRENT_COMMIT=\$(git rev-parse HEAD)
            echo \$CURRENT_COMMIT > .last_deploy

            cat > .env <<ENVFILE
          DOMAIN=${DOMAIN}
          FRONTEND_HOST=${FRONTEND_HOST}
          ENVIRONMENT=production
          STACK_NAME=${STACK_NAME}
          PROJECT_NAME=${PROJECT_NAME}
          SECRET_KEY=${SECRET_KEY}
          FIRST_SUPERUSER=${FIRST_SUPERUSER}
          FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
          BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
          VITE_API_URL=${VITE_API_URL}
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SMTP_HOST=${SMTP_HOST}
          SMTP_USER=${SMTP_USER}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
          DOCKER_IMAGE_BACKEND=ghcr.io/\$REPO/backend:\$TAG
          DOCKER_IMAGE_FRONTEND=ghcr.io/\$REPO/frontend:\$TAG
          ENVFILE

            # Log in to pull the pre-built images
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            # Just pull — no build on server
            docker compose -f docker-compose.yml pull backend frontend

            docker compose -f docker-compose.yml up -d db
            docker compose -f docker-compose.yml run --rm prestart

            if ! docker compose -f docker-compose.yml up -d --force-recreate --no-deps backend frontend; then
              echo "Rolling back..."
              git checkout \$(cat .last_deploy)
              docker compose -f docker-compose.yml up -d
              exit 1
            fi

            echo "Deploy complete: \$TAG"
          EOF
