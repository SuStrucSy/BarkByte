          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Dois
      tags:
        - doi

    post:
      description: Create DOI.
      operationId: doi-create_doi
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DOICreate"
        required: true
      responses:
