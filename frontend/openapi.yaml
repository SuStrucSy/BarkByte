          title: Id
          type: string
        link:
          maxLength: 255
          minLength: 1
          title: Link
          type: string
        pub_year:
          title: Pub Year
          type: integer
        ref_title:
          maxLength: 255
          minLength: 1
          title: Ref Title
          type: string
      required:
        - link
        - ref_title
        - authors
        - pub_year
      title: DOI
      type: object

