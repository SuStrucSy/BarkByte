components:
  schemas:
    AssemblyType:
      type: string
      enum:
        - Wall-Floor
        - Wall-Wall
        - Wall-Floor & Wall-Wall
      title: AssemblyType
    Body_login-login_access_token:
      properties:
        grant_type:
          anyOf:
            - type: string
              pattern: password
            - type: "null"
          title: Grant Type
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
        scope:
          type: string
          title: Scope
          default: ""
        client_id:
          anyOf:
            - type: string
            - type: "null"
          title: Client Id
        client_secret:
          anyOf:
            - type: string
            - type: "null"
          title: Client Secret
      type: object
      required:
        - username
        - password
      title: Body_login-login_access_token
    DOI:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        link:
          type: string
          maxLength: 255
          minLength: 1
          title: Link
        ref_title:
          type: string
          maxLength: 255
          minLength: 1
          title: Ref Title
        authors:
          type: string
          maxLength: 255
          minLength: 1
          title: Authors
        pub_year:
          type: integer
          title: Pub Year
      type: object
      required:
        - link
        - ref_title
        - authors
        - pub_year
      title: DOI
    DOICreate:
      properties:
        link:
          type: string
          title: Link
        ref_title:
          type: string
          title: Ref Title
        authors:
          type: string
          title: Authors
        pub_year:
          type: integer
          title: Pub Year
      type: object
      required:
        - link
        - ref_title
        - authors
        - pub_year
      title: DOICreate
    DOIDetailPublic:
      properties:
        link:
          type: string
          title: Link
        ref_title:
          type: string
          title: Ref Title
        authors:
          type: string
          title: Authors
        pub_year:
          type: integer
          title: Pub Year
        id:
          type: string
          format: uuid
          title: Id
        specimens:
          $ref: "#/components/schemas/SpecimensPublic"
      type: object
      required:
        - link
        - ref_title
        - authors
        - pub_year
        - id
        - specimens
      title: DOIDetailPublic
