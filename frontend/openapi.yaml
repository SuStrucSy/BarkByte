  /api/v1/failuremode/:
    get:
      tags:
        - failuremode
      summary: Get Modes
      description: |-
        Retrieve failure modes.

        Filters:
          - ?dowel=true       -> include FailureMode.type == DOWEL
          - ?connector=true   -> include FailureMode.type == CONNECTOR
          - both true         -> include either type
          - none provided     -> return only WOOD and OTHER
      operationId: failuremode-get_modes
      parameters:
        - name: dowel
          in: query
          required: true
          schema:
            type: boolean
            title: Dowel
        - name: connector
          in: query
          required: true
          schema:
            type: boolean
            title: Connector
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
            title: Skip
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            title: Limit
      responses:
