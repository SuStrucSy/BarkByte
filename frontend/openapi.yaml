openapi: 3.1.0
info:
  title: Timverse
  version: 1.2.0
paths:
  /api/v1/login/access-token:
    post:
      tags:
        - login
      summary: Login Access Token
      description: OAuth2 compatible token login, get an access token for future requests
      operationId: login-login_access_token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Body_login-login_access_token"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "400":
          description: Incorrect email or password
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/login/test-token:
    post:
      tags:
        - login
      summary: Test Token
      description: Test access token
      operationId: login-test_token
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
      security:
        - OAuth2PasswordBearer: []
  /api/v1/password-recovery/{email}:
    post:
      tags:
        - login
      summary: Recover Password
      description: Password Recovery
      operationId: login-recover_password
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            title: Email
      responses:
        "200":
          description: If an account exists with that email, you'll receive recovery
            instructions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/reset-password/:
    post:
      tags:
        - login
      summary: Reset Password
      description: Reset password
      operationId: login-reset_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPassword"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid token or inactive user
        "404":
          description: The user with this email does not exist in the system.
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/set-password:
    post:
